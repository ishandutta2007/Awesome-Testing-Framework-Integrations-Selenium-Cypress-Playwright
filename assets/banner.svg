<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1200 360"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="45%" stop-color="#0d1829"/><stop offset="100%" stop-color="#050a14"/></linearGradient><linearGradient id="primaryGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="pillCypress" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#10b981"/></linearGradient><linearGradient id="pillPlaywright" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient><linearGradient id="pillSelenium" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient><linearGradient id="pillCloud" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#a855f7"/></linearGradient><linearGradient id="gridLine" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/><stop offset="50%" stop-color="#38bdf8" stop-opacity=".25"/><stop offset="100%" stop-color="#818cf8" stop-opacity="0"/></linearGradient><filter id="subtleGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes scanline{0%{transform:translateY(-50px);opacity:0}20%,80%{opacity:.8}}@keyframes floatPill1{0%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes floatPill2{0%{transform:translateY(0)}50%{transform:translateY(7px)}}@keyframes floatPill3{0%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes floatPill4{0%{transform:translateY(0)}50%{transform:translateY(6px)}}.code-font{font-family:&apos;JetBrains Mono&apos;,&apos;Fira Code&apos;,&apos;Courier New&apos;,monospace}.ui-font{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.ambient-sphere{animation:pulseGlow 7s ease-in-out infinite alternate;transform-origin:center}.scanner{animation:scanline 8s linear infinite}.pill-1{animation:floatPill1 4.5s ease-in-out infinite}.pill-2{animation:floatPill2 5.2s ease-in-out infinite}.pill-3{animation:floatPill3 4.8s ease-in-out infinite}.pill-4{animation:floatPill4 5.6s ease-in-out infinite}</style><rect width="1200" height="360" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="1.5" rx="16"/><circle cx="200" cy="90" r="140" fill="#38bdf8" class="ambient-sphere" filter="url(#subtleGlow)" opacity=".12"/><circle cx="1020" cy="270" r="160" fill="#ec4899" class="ambient-sphere" filter="url(#subtleGlow)" opacity=".1" style="animation-delay:-3.5s"/><circle cx="600" cy="180" r="180" fill="#6366f1" class="ambient-sphere" filter="url(#subtleGlow)" opacity=".08" style="animation-delay:-2s"/><g stroke="#94a3b8" stroke-width=".8" opacity=".12"><line x1="80" x2="80" y1="0" y2="360" stroke-dasharray="4 6"/><line x1="280" x2="280" y1="0" y2="360" stroke-dasharray="4 6"/><line x1="480" x2="480" y1="0" y2="360" stroke-dasharray="4 6"/><line x1="680" x2="680" y1="0" y2="360" stroke-dasharray="4 6"/><line x1="880" x2="880" y1="0" y2="360" stroke-dasharray="4 6"/><line x1="1080" x2="1080" y1="0" y2="360" stroke-dasharray="4 6"/><line x1="0" x2="1200" y1="60" y2="60" stroke-dasharray="4 6"/><line x1="0" x2="1200" y1="180" y2="180" stroke-dasharray="4 6"/><line x1="0" x2="1200" y1="300" y2="300" stroke-dasharray="4 6"/></g><line x1="60" x2="1140" y1="0" y2="0" stroke="url(#gridLine)" stroke-width="2" class="scanner"/><g fill="#38bdf8" class="code-font" font-size="12" opacity=".18"><text x="860" y="55">const { test, expect } = require(&apos;@playwright/test&apos;);</text><text x="860" y="75">cy.visit(&apos;https://app.dev&apos;);</text><text x="860" y="95">driver.manage().timeouts().implicitlyWait(...);</text></g><g><g transform="translate(100, 48)"><rect width="260" height="28" fill="#0f172a" stroke="#334155" stroke-width="1" rx="14"/><circle cx="16" cy="14" r="5" fill="#10b981"/><text x="32" y="18" fill="#94a3b8" class="ui-font" font-size="11.5" font-weight="600" letter-spacing="1.2">ENTERPRISE QA &amp; AUTOMATION</text></g><text x="100" y="128" fill="url(#primaryGlow)" class="ui-font" filter="url(#subtleGlow)" font-size="44" font-weight="900" letter-spacing="-.5">Awesome Testing Frameworks</text><text x="100" y="168" fill="#f8fafc" class="ui-font" font-size="21" font-weight="600">Selenium • Cypress • Playwright • Appium • Cloud Testing Platforms</text><text x="100" y="202" fill="#94a3b8" class="ui-font" font-size="14.5" font-weight="400">Curated cross-browser orchestration, cloud device grids, headless runners, and CI/CD automation.</text><g><g class="pill-1" transform="translate(100, 240) translate(0, 0)"><rect width="180" height="42" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" rx="10"/><rect width="30" height="30" x="6" y="6" fill="url(#pillPlaywright)" rx="7"/><text x="21" y="26" fill="#fff" class="ui-font" font-size="15" font-weight="bold" text-anchor="middle">🎭</text><text x="46" y="22" fill="#fff" class="ui-font" font-size="13" font-weight="700">Playwright</text><text x="46" y="34" fill="#38bdf8" class="code-font" font-size="10.5" font-weight="600">vLatest • Fast</text></g><g class="pill-2" transform="translate(100, 240) translate(200, 0)"><rect width="180" height="42" fill="#0f172a" stroke="#10b981" stroke-width="1.2" rx="10"/><rect width="30" height="30" x="6" y="6" fill="url(#pillCypress)" rx="7"/><text x="21" y="26" fill="#fff" class="ui-font" font-size="15" font-weight="bold" text-anchor="middle">🌲</text><text x="46" y="22" fill="#fff" class="ui-font" font-size="13" font-weight="700">Cypress</text><text x="46" y="34" fill="#34d399" class="code-font" font-size="10.5" font-weight="600">In-Browser E2E</text></g><g class="pill-3" transform="translate(100, 240) translate(400, 0)"><rect width="180" height="42" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" rx="10"/><rect width="30" height="30" x="6" y="6" fill="url(#pillSelenium)" rx="7"/><text x="21" y="26" fill="#fff" class="ui-font" font-size="15" font-weight="bold" text-anchor="middle">🌐</text><text x="46" y="22" fill="#fff" class="ui-font" font-size="13" font-weight="700">Selenium</text><text x="46" y="34" fill="#fbbf24" class="code-font" font-size="10.5" font-weight="600">W3C WebDriver</text></g><g class="pill-4" transform="translate(100, 240) translate(600, 0)"><rect width="210" height="42" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" rx="10"/><rect width="30" height="30" x="6" y="6" fill="url(#pillCloud)" rx="7"/><text x="21" y="26" fill="#fff" class="ui-font" font-size="15" font-weight="bold" text-anchor="middle">☁️</text><text x="46" y="22" fill="#fff" class="ui-font" font-size="13" font-weight="700">Cloud Testing SaaS</text><text x="46" y="34" fill="#c084fc" class="code-font" font-size="10.5" font-weight="600">Real Devices &amp; Grids</text></g></g><g transform="translate(100, 312)"><circle cx="6" cy="6" r="4" fill="#38bdf8"/><text x="18" y="10" fill="#64748b" class="ui-font" font-size="12">Curated with Star Ratings, Pricing &amp; Architectural Matrix</text></g></g></svg>